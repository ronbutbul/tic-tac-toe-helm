{{- range $key, $mcp := .Values.mcps }}
{{- if $mcp.enabled }}
{{- $resourceName := include "mcp-tools.resourceName" (dict "releaseName" $.Release.Name "mcpKey" $key) }}
{{- $port := include "mcp-tools.mcpPort" (dict "mcp" $mcp) | int }}
{{- $probes := dig "healthCheck" dict $mcp }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mcp-tools.mcpLabels" (dict "chartName" $.Chart.Name "chartVersion" $.Chart.Version "mcpKey" $key "releaseName" $.Release.Name "releaseService" $.Release.Service) | nindent 4 }}
spec:
  replicas: {{ dig "replicas" 1 $mcp }}
  {{- with $mcp.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-tools.mcpSelectorLabels" (dict "mcpKey" $key "releaseName" $.Release.Name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include "mcp-tools.configmapChecksum" (dict "mcp" $mcp) }}
        {{- with $mcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-tools.mcpSelectorLabels" (dict "mcpKey" $key "releaseName" $.Release.Name) | nindent 8 }}
        {{- with $mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (default $.Values.imagePullSecrets $mcp.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ if (dig "serviceAccount" "create" true $mcp) }}{{ $resourceName }}{{ else }}{{ dig "serviceAccount" "name" "default" $mcp }}{{ end }}
      {{- with $mcp.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $key }}
          {{- with $mcp.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "mcp-tools.mcpImage" (dict "mcp" $mcp "mcpKey" $key) | quote }}
          imagePullPolicy: {{ dig "image" "pullPolicy" "IfNotPresent" $mcp }}
          {{- with $mcp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $mcp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $mcp.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $resourceName }}
            {{- if $mcp.secretData }}
            - secretRef:
                name: {{ $resourceName }}
            {{- end }}
            {{- with $mcp.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          {{- if dig "enabled" false $probes }}
          readinessProbe:
            httpGet:
              path: {{ dig "path" "/health" $probes }}
              port: http
            initialDelaySeconds: {{ dig "readiness" "initialDelaySeconds" 10 $probes }}
            periodSeconds: {{ dig "readiness" "periodSeconds" 10 $probes }}
            timeoutSeconds: {{ dig "readiness" "timeoutSeconds" 5 $probes }}
            failureThreshold: {{ dig "readiness" "failureThreshold" 3 $probes }}
          livenessProbe:
            httpGet:
              path: {{ dig "path" "/health" $probes }}
              port: http
            initialDelaySeconds: {{ dig "liveness" "initialDelaySeconds" 30 $probes }}
            periodSeconds: {{ dig "liveness" "periodSeconds" 30 $probes }}
            timeoutSeconds: {{ dig "liveness" "timeoutSeconds" 5 $probes }}
            failureThreshold: {{ dig "liveness" "failureThreshold" 3 $probes }}
          {{- end }}
          {{- with $mcp.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $mcp.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
