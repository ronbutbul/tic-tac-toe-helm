# ==============================================================================
# MODEL CONFIGS
# ==============================================================================
modelConfigs:

  bedrock-guardrailed:
    enabled: true
    provider: OpenAI
    model: openai.gpt-oss-120b-1:0

    apiKeySecret: vllm-dummy-key
    apiKeySecretKey: OPENAI_API_KEY

    defaultHeaders:
      X-Amzn-Bedrock-GuardrailIdentifier: "arn:aws:bedrock:eu-central-1:941284018955:guardrail/wrfcu805qvyf"
      X-Amzn-Bedrock-GuardrailVersion: "DRAFT"

    providerConfig:
      baseUrl: http://bedrock-sigv4-proxy.default.svc.cluster.local:8080/openai/v1



# ==============================================================================
# PROXIES
# ==============================================================================
# Signs Bedrock requests with the IAM role on the kagent-bedrock ServiceAccount
# (IRSA). Everything else -- image, region, upstream host, stripped headers --
# comes from the defaults in values.yaml; this only turns it on.
proxies:
  bedrock-sigv4-proxy:
    enabled: true

# ==============================================================================
# MCP SERVERS
# ==============================================================================
mcps:
  elasticsearch-mcp:
    env:
      ES_MCP_CONNECTION_STRING: "http://elastic-kibana-elasticsearch:9200"

  mongodb-mcp:
    env:
      MDB_MCP_CONNECTION_STRING: "mongodb://mongo8-primary:27017"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"

  kafka-mcp:
    env:
      KAFKA_BOOTSTRAP_SERVERS: "bitnami-kafka:9092"
      KAFKA_ADMIN_SERVERS: "bitnami-kafka-controller-headless:9093"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
