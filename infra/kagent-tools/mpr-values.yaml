# ==============================================================================
# MODEL CONFIGS
# ==============================================================================
modelConfigs:
  # Bedrock via its OpenAI-compatible endpoint, with an AWS Bedrock guardrail
  # applied through request headers.
  bedrock-guardrailed:
    enabled: true
    provider: OpenAI
    model: openai.gpt-oss-120b-1:0

    apiKeySecret: kagent-bedrock
    apiKeySecretKey: AWS_API_KEY

    # Renders the kagent-bedrock Secret as Secret.data (already base64-encoded,
    # copied verbatim from the cluster). This is a live AWS credential committed
    # to the repo by choice; rotate it in Bedrock if the repo is ever shared.
    apiKeySecretDataB64:
      AWS_API_KEY: ""

    defaultHeaders:
      X-Amzn-Bedrock-GuardrailIdentifier: "arn:aws:bedrock:eu-central-1:941284018955:guardrail/wrfcu805qvyf"
      X-Amzn-Bedrock-GuardrailVersion: "DRAFT"

    providerConfig:
      baseUrl: https://bedrock-runtime.eu-central-1.amazonaws.com/openai/v1


# ==============================================================================
# MCP SERVERS
# ==============================================================================
mcps:
  elasticsearch-mcp:
    env:
      ES_MCP_CONNECTION_STRING: "http://elastic-kibana-elasticsearch:9200"

  mongodb-mcp:
    env:
      MDB_MCP_CONNECTION_STRING: "mongodb://mongo8-primary:27017"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"

  kafka-mcp:
    env:
      KAFKA_BOOTSTRAP_SERVERS: "bitnami-kafka:9092"
      KAFKA_ADMIN_SERVERS: "bitnami-kafka-controller-headless:9093"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
