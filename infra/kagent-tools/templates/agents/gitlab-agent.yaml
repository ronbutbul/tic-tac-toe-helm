{{- $agentKey := "gitlab" }}
{{- $mcpKey := "gitlab-mcp" }}
{{- $agent := dig $agentKey dict (default dict .Values.agents) }}
{{- $mcp := dig $mcpKey dict (default dict .Values.mcps) }}
{{- if and (dig "enabled" false $mcp) (dig "enabled" false $agent) }}
{{- $agentName := dig "name" (printf "%s-agent" $agentKey) $agent }}
{{- $mcpName := include "mcp-tools.resourceName" (dict "releaseName" .Release.Name "mcpKey" $mcpKey) }}
{{- /*
Every tool here is read-only, matching mcps.gitlab-mcp.env.GITLAB_READ_ONLY.
If that is ever set to "false", the MCP exposes write tools too -- they still
have to be listed here before the agent can call them.
*/}}
{{- $toolNames := dig "toolNames" (list
      "compare-refs"
      "get-branch"
      "get-commit"
      "get-commit-diff"
      "get-current-user"
      "get-file-contents"
      "get-group"
      "get-issue"
      "get-job"
      "get-job-log"
      "get-merge-request"
      "get-merge-request-diffs"
      "get-pipeline"
      "get-project"
      "get-repository-tree"
      "list-branches"
      "list-commits"
      "list-group-projects"
      "list-groups"
      "list-issue-notes"
      "list-issues"
      "list-labels"
      "list-merge-request-notes"
      "list-merge-requests"
      "list-milestones"
      "list-pipeline-jobs"
      "list-pipelines"
      "list-project-members"
      "list-projects"
      "list-tags"
      "list-users"
      "search") $agent }}
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $agentName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-tools.mcpLabels" (dict "chartName" .Chart.Name "chartVersion" .Chart.Version "mcpKey" $agentName "releaseName" .Release.Name "releaseService" .Release.Service) | nindent 4 }}
  {{- with dig "annotations" dict $agent }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  description: {{ dig "description" "GitLab assistant agent (via MCP)" $agent | quote }}
  type: Declarative
  declarative:
    modelConfig: {{ $agent.modelConfigRef | default $agent.modelConfig | default "vllm-gpt" }}
    {{- with $agent.runtime }}
    runtime: {{ . }}
    {{- end }}
    stream: {{ dig "stream" true $agent }}
    systemMessage: |-
      {{- include "mcp-tools.agentSystemMessage" (dict "root" $ "agentKey" $agentKey "indent" 6) }}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ $mcpName }}
          toolNames:
            {{- toYaml $toolNames | nindent 12 }}
    {{- with (include "mcp-tools.agentMemory" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with (include "mcp-tools.agentContext" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with dig "deployment" dict $agent }}
    deployment:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
