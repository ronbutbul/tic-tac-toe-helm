# Default values for mcp-tools
# To add a new MCP, just add an entry under "mcps" — no template or Chart.yaml changes needed.
# Agents are defined as individual templates under templates/agents/.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: tsinf-reg

# ==============================================================================
# MCP SERVERS
# ==============================================================================
# Each key under "mcps" creates: Deployment, Service, ConfigMap, ServiceAccount,
# RemoteMCPServer, and optionally a Secret.
mcps:
  # ============================================================================
  # ELASTICSEARCH MCP
  # ============================================================================
  elasticsearch-mcp:
    enabled: true
    replicas: 1

    image:
      registry: artifactory.rafael.co.il:6001
      repository: infra/elasticsearch-mcp-service
      pullPolicy: IfNotPresent
      tag: "20260224-105241-7f40c5fd"

    service:
      type: ClusterIP
      port: 8000

    # Environment variables injected via ConfigMap
    env:
      ES_MCP_CONNECTION_STRING: "http://elastic-kibana-elasticsearch:9200"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Optional secret data (uncomment to use)
    # secretData:
    #   ES_API_KEY: "my-api-key"

    serviceAccount:
      create: true
      annotations: {}

    securityContext: {}
    tolerations: []
    nodeSelector: {}
    volumes: []
    volumeMounts: []
    extraConfig: {}

  # ============================================================================
  # trail MCP
  # ============================================================================
  trail-mcp:
    enabled: false
    replicas: 1

    image:
      registry: artifactory.rafael.co.il:6001/flight
      repository: flight-mcp-simulator
      pullPolicy: IfNotPresent
      tag: "0.3.0"

    service:
      type: ClusterIP
      port: 7001

    env:
      FLIGHT_DRONE_MANAGER_URL: "https://common-drone-manager-rafael-tsgs-cicd-flight.apps.ocp-tsgs.aws2.rafael.co.il"
      FLIGHT_INFRA_MANAGER_URL: "https://flight-infra-manager-rafael-tsgs-cicd-flight.apps.ocp-tsgs.aws2.rafael.co.il"
      MISSION_HYDRA_SIM_BE_URL: "https://mission-hydra-sim-be-rafael-tsgs-cicd-mission.apps.ocp-tsgs.aws2.rafael.co.il"
      MISSION_INVESTIGATOR_SIM_BE_URL: "https://mission-investigator-sim-be-rafael-tsgs-cicd-mission.apps.ocp-tsgs.aws2.rafael.co.il"
      KLV_SIM_URL: "https://common-klv-sim-rafael-tsgs-cicd-mission.apps.ocp-tsgs.aws2.rafael.co.il"
      HOST: "0.0.0.0"
      PORT: "7001"
      REQUEST_TIMEOUT_SECONDS: "10.0"
      SIMULATION_INTERVAL_SECONDS: "1.0"
      ENABLE_HYDRA_TOOLS: "true"
      ENABLE_INVESTIGATOR_TOOLS: "true"
      LEVEL: "INFO"
      FORMAT: "json"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceAccount:
      create: true
      annotations: {}

    securityContext: {}
    tolerations: []
    nodeSelector: {}
    volumes: []
    volumeMounts: []
    extraConfig: {}

  # ============================================================================
  # KAFKA MCP
  # ============================================================================
  kafka-mcp:
    enabled: true
    replicas: 1

    image:
      registry: 941284018955.dkr.ecr.il-central-1.amazonaws.com
      repository: mcp-kafka-service
      pullPolicy: Always
      tag: "20260203-110114-15951fd6"

    service:
      type: ClusterIP
      port: 8000

    env:
      KAFKA_BOOTSTRAP_SERVERS: "http://localhost:9092"
      KAFKA_ADMIN_SERVERS: "http://localhost:9093"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceAccount:
      create: true
      annotations: {}

    securityContext: {}
    tolerations: []
    nodeSelector: {}
    volumes: []
    volumeMounts: []
    extraConfig: {}

  # ============================================================================
  # MONGO MCP
  # ============================================================================
  mongo-mcp:
    enabled: true
    replicas: 1

    image:
      registry: 941284018955.dkr.ecr.il-central-1.amazonaws.com
      repository: mongodb-mcp-service
      pullPolicy: Always
      tag: "20260202-131744-c6772109"

    service:
      type: ClusterIP
      port: 8000

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceAccount:
      create: true
      annotations: {}

    securityContext: {}
    tolerations: []
    nodeSelector: {}
    volumes: []
    volumeMounts: []
    extraConfig: {}
# ==============================================================================
# AGENTS
# ==============================================================================
# Agent enable flags. The agent templates live under templates/agents/.
agents:
  elasticsearch:
    enabled: true
    modelConfig: "vllm-gpt"
  kafka:
    enabled: true
    modelConfig: "vllm-gpt"
  mongodb:
    enabled: true
    modelConfig: "vllm-gpt"
