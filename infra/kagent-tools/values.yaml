# Default values for mcp-tools
# To add a new MCP, just add an entry under "mcps" -- no template or Chart.yaml changes needed.
# To add a new ModelConfig, add an entry under "modelConfigs" -- same deal.
# Agents are defined as individual templates under templates/agents/, and their
# systemMessage lives in agents-rules/<agent>.md at the chart root.

# Every resource is named <release>-<mcp-key>. There is deliberately no
# nameOverride: the MCP labels double as the Deployment selector, which is
# immutable, so a rename knob would break upgrades on existing releases.

# Applied to every MCP pod. Override per-MCP with mcps.<key>.imagePullSecrets.
imagePullSecrets: []
# - name: my-registry-creds


# ModelConfig an agent uses when its block names none. Must match a key under
# modelConfigs below; it is the single place the fallback is written down.
defaultModelConfig: bedrock-guardrailed


# ==============================================================================
# MODEL CONFIGS
# ==============================================================================
# Each key under "modelConfigs" creates one kagent ModelConfig (and optionally
# the Secret holding its API key). The key is the resource name, which is what
# agents reference via agents.<agent>.modelConfig.
modelConfigs:
  bedrock-guardrailed:
    enabled: true
    # name: bedrock-guardrailed          # defaults to the key above
    provider: OpenAI
    model: openai.gpt-oss-120b-1:0

    # Secret holding the API key, and the key inside it.
    apiKeySecret: vllm-dummy-key
    apiKeySecretKey: OPENAI_API_KEY

    # apiKeySecretDataB64 is the same thing for values that are already
    # base64-encoded (e.g. copied out of `kubectl get secret -o yaml`); it
    # renders as Secret.data instead of Secret.stringData.
    #
    # Creates the Secret named in apiKeySecret above.
    # Value must match the live Secret exactly -- this chart adopts the
    # pre-existing "vllm-dummy-key" Secret rather than creating a fresh one,
    # and on upgrade this value overwrites whatever is in the cluster.
    # vLLM does not authenticate, hence "unused".
    apiKeySecretData:
      OPENAI_API_KEY: "unused"

    # Rendered under the provider-specific field -- OpenAI -> openAI,
    # AzureOpenAI -> azureOpenAI, Anthropic -> anthropic, and so on.
    providerConfig:
      baseUrl: http://bedrock-sigv4-proxy.default.svc.cluster.local:8080/openai/v1
      # temperature: "0.7"
      # maxTokens: 4096

    # providerField: openAI   # only if a provider breaks the naming convention
    # defaultHeaders: {}
    # annotations: {}
    # extraSpec: {}           # raw passthrough for spec fields not modelled here

  # Embedding model. Shares the vllm-dummy-key Secret created by bedrock-guardrailed above,
  # so it deliberately does NOT set apiKeySecretData -- two blocks declaring the
  # same apiKeySecret would render two Secrets with the same name.
  vllm-emb:
    enabled: true
    provider: OpenAI
    model: /data/bge-base-en-v1.5

    apiKeySecret: vllm-dummy-key
    apiKeySecretKey: OPENAI_API_KEY

    providerConfig:
      # Cluster-specific -- override in the environment values file.
      baseUrl: http://vllm-emb-embedding-engine-service.default.svc.cluster.local/v1


# ==============================================================================
# PROXIES
# ==============================================================================
# Sidecar-less signing proxies that sit between an agent and an upstream API.
# Each key creates a Deployment + Service (and optionally a ServiceAccount).
#
# Unlike MCPs, a proxy is NOT named <release>-<key>: the key is the resource
# name, because the name is part of the proxy's contract -- a ModelConfig
# baseUrl points at its in-cluster Service DNS. Override with .name.
proxies:
  # AWS SigV4 signing proxy for Bedrock. Agents speak plain OpenAI to this
  # Service; it signs each request with the IAM role bound to its
  # ServiceAccount and forwards it to Bedrock. That is what lets the Bedrock
  # ModelConfig carry no AWS credential at all.
  bedrock-sigv4-proxy:
    enabled: false
    # name: bedrock-sigv4-proxy   # defaults to the key above
    replicas: 1

    image:
      registry: public.ecr.aws
      repository: aws-observability/aws-sigv4-proxy
      pullPolicy: IfNotPresent
      tag: "1.10"

    # The IAM role is attached to this ServiceAccount via IRSA, so the proxy
    # needs no credentials of its own. create: false adopts a ServiceAccount
    # that already carries the eks.amazonaws.com/role-arn annotation; flip it to
    # true and set annotations here to have the chart own it instead.
    serviceAccount:
      create: false
      name: kagent-bedrock
      annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<bedrock-role>

    # Drives the container port, the --port arg and the Service target at once,
    # so they cannot drift apart.
    service:
      type: ClusterIP
      port: 8080
      annotations: {}

    # Rendered into the container args by mcp-tools.proxyArgs.
    sigv4:
      # AWS service to sign for, and the region to sign in.
      name: bedrock
      region: eu-central-1

      # Upstream endpoint. signHost defaults to host when omitted.
      host: bedrock-runtime.eu-central-1.amazonaws.com
      # signHost: bedrock-runtime.eu-central-1.amazonaws.com

      # Headers dropped before signing. The OpenAI client always sends an
      # "Authorization: Bearer <dummy>"; leaving it in place would collide with
      # the SigV4 Authorization header the proxy adds.
      strip:
        - Authorization

      # listenAddress: 0.0.0.0

      # Signing diagnostics. Verbose logging of the signing process is useful
      # while wiring IRSA up, but noisy once it works -- turn these off in a
      # steady-state cluster.
      verbose: true
      logFailedRequests: true
      logSigningProcess: true

    # extraArgs: []             # raw args appended after the generated ones
    # args: []                  # set to bypass sigv4/extraArgs entirely

    env:
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1

    # extraEnv: []              # raw env entries, e.g. valueFrom blocks
    # extraEnvFrom: []

    # TCP probes: a signing proxy forwards every path upstream, so it has no
    # local health endpoint to hit.
    healthCheck:
      enabled: true
      readiness:
        initialDelaySeconds: 2
        periodSeconds: 5
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 10

    resources: {}
      # requests:
      #   cpu: 50m
      #   memory: 64Mi
      # limits:
      #   memory: 256Mi

    # podAnnotations: {}
    # podLabels: {}
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}


# ==============================================================================
# MCP SERVERS
# ==============================================================================
# Each key under "mcps" creates: Deployment, Service, ConfigMap, ServiceAccount,
# RemoteMCPServer, and optionally a Secret.
mcps:
  # ============================================================================
  # ELASTICSEARCH MCP
  # ============================================================================
  elasticsearch-mcp:
    enabled: true
    replicas: 1

    image:
      registry: ronbutbul135
      repository: elasticsearch-mcp-service
      pullPolicy: IfNotPresent
      tag: "20260212-172526-36c9253b"

    service:
      type: ClusterIP
      port: 8000
      annotations: {}

    # Environment variables injected via ConfigMap
    # Endpoint is environment-specific -- set it in the environment values file.
    # env:
    #   ES_MCP_CONNECTION_STRING: "http://elasticsearch:9200"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Optional secret data -- creates a Secret and wires it in via envFrom.
    # secretData:
    #   ES_API_KEY: "my-api-key"

    serviceAccount:
      create: true
      annotations: {}
      # name: ""              # used only when create: false

    # RemoteMCPServer tuning (defaults shown)
    # description: "elasticsearch-mcp MCP server"
    # protocol: STREAMABLE_HTTP
    # path: /mcp
    # timeout: 30s
    # sseReadTimeout: 5m0s
    # terminateOnClose: true

    # HTTP probes -- off by default because not every MCP image serves /health.
    healthCheck:
      enabled: false
      path: /health
      # readiness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
      # liveness:  { initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }

    # Example: mounting a custom CA bundle
    # volumes:
    #   - name: trusted-ca
    #     configMap:
    #       name: trusted-ca
    #       items:
    #         - key: ca-bundle.crt
    #           path: extra-certificates.crt
    # volumeMounts:
    #   - name: trusted-ca
    #     mountPath: /etc/ssl/certs/extra-certificates.crt
    #     subPath: extra-certificates.crt
    #     readOnly: true
    # extraConfig:
    #   REQUESTS_CA_BUNDLE: /etc/ssl/certs/extra-certificates.crt
    #   SSL_CERT_FILE: /etc/ssl/certs/extra-certificates.crt
    #   CURL_CA_BUNDLE: /etc/ssl/certs/extra-certificates.crt

  # ============================================================================
  # TRAIL MCP (placeholder -- fill in image/env before enabling)
  # ============================================================================
  trail-mcp:
    enabled: false
    replicas: 1
    image:
      registry: ""
      repository: ""
      pullPolicy: IfNotPresent
      tag: ""
    service:
      type: ClusterIP
      port: 8000
    env: {}
    serviceAccount:
      create: true
      annotations: {}

  # ============================================================================
  # KAFKA MCP
  # ============================================================================
  kafka-mcp:
    enabled: true
    replicas: 1

    image:
      registry: 941284018955.dkr.ecr.il-central-1.amazonaws.com
      repository: mcp-kafka-service
      pullPolicy: Always
      tag: "20260203-110114-15951fd6"

    service:
      type: ClusterIP
      port: 8000
      annotations: {}

    env:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Brokers are environment-specific -- set them in the environment values file.
      # KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # KAFKA_ADMIN_SERVERS: "kafka-controller-headless:9093"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceAccount:
      create: true
      annotations: {}

    healthCheck:
      enabled: false
      path: /health


  # ============================================================================
  # MONGODB MCP
  # ============================================================================
  mongodb-mcp:
    enabled: true
    replicas: 1

    image:
      registry: 941284018955.dkr.ecr.il-central-1.amazonaws.com
      repository: mongodb-mcp-service
      pullPolicy: Always
      tag: "20260202-131744-c6772109"

    service:
      type: ClusterIP
      port: 8000
      annotations: {}

    env:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Connection string is environment-specific -- set it in the environment values file.
      # MDB_MCP_CONNECTION_STRING: "mongodb://mongo:27017"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    serviceAccount:
      create: true
      annotations: {}

    healthCheck:
      enabled: false
      path: /health

  # ============================================================================
  # GITLAB MCP
  # ============================================================================
  gitlab-mcp:
    enabled: true
    replicas: 1

    image:
      registry: 941284018955.dkr.ecr.il-central-1.amazonaws.com
      repository: gitlab-mcp-service
      pullPolicy: Always
      tag: "20260927-102642-ba944334"

    service:
      type: ClusterIP
      port: 8000
      annotations: {}

    env:
      # Instance URL is environment-specific -- set it in the environment values file.
      # GITLAB_URL: "https://gitlab.example.com"
      # Refuse every write -- no pushes, MR merges or issue edits.
      GITLAB_READ_ONLY: "true"
      GITLAB_VERIFY_SSL: "false"
      # Only set together with the volumeMount below: an unmounted path fails
      # TLS instead of falling back to the system trust store.
      # GITLAB_CA_BUNDLE: /etc/ssl/certs/gitlab-ca.crt
      # Seconds. Keep under the RemoteMCPServer timeout so the MCP gives up first.
      GITLAB_TIMEOUT: "30"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Creates the <release>-gitlab-mcp Secret and wires it in via envFrom, which
    # keeps the token out of the ConfigMap. It is still committed to the repo,
    # so scope it to read_api on a single project or group rather than using a
    # personal token, and rotate it in GitLab if this repo is shared.
    # Set GITLAB_TOKEN in the environment values file, never here -- a credential
    # in chart defaults applies to every environment that installs this chart.
    # secretData:
    #   GITLAB_TOKEN: "glpat-xxxxxxxxxxxx"

    serviceAccount:
      create: true
      annotations: {}

    # RemoteMCPServer tuning. GitLab's API is slower than the other MCPs here,
    # so timeout is raised from the 30s default.
    timeout: 60s
    # description: "gitlab-mcp MCP server"
    # protocol: STREAMABLE_HTTP
    # path: /mcp
    # sseReadTimeout: 5m0s
    # terminateOnClose: true

    healthCheck:
      enabled: false
      path: /health

    # Example: private CA for a self-hosted GitLab. Mount the bundle, then point
    # GITLAB_CA_BUNDLE above at the mountPath.
    # volumes:
    #   - name: gitlab-ca
    #     configMap:
    #       name: gitlab-ca
    #       items:
    #         - key: ca.crt
    #           path: gitlab-ca.crt
    # volumeMounts:
    #   - name: gitlab-ca
    #     mountPath: /etc/ssl/certs/gitlab-ca.crt
    #     subPath: gitlab-ca.crt
    #     readOnly: true



# ==============================================================================
# AGENTS
# ==============================================================================
# Every agent is agentDefaults deep-merged with its own block below, so each
# agent only states what differs. Its systemMessage comes from
# agents-rules/<key>.md -- edit the prompt there, not in values.
#
# Adding an agent: write agents-rules/<key>.md, add a block here. That is all;
# there is no per-agent template.
#
# An agent is backed by the MCP named "<key>-mcp" when one exists (override with
# "mcp:"), and renders only when that MCP is enabled too. Set "delegates:" for an
# orchestrator whose tools are other agents, or neither for a standalone agent.
agentDefaults:
  stream: true
  memory:
    enabled: true
    # Must name a ModelConfig backed by an EMBEDDING model -- it generates the
    # memory vectors. Required by the CRD whenever memory is enabled.
    modelConfigRef: "vllm-emb"
    ttlDays: 15
  # Event-history compaction -> spec.declarative.context.compaction. Keys left
  # out fall through to the CRD's own defaults (compactionInterval 5,
  # overlapSize 2). Set "enabled: false" on an agent to switch it off.
  compaction:
    compactionInterval: 5
    tokenThreshold: 25000
    overlapSize: 2
    eventRetentionSize: 10
    summarizer:
      modelConfig: bedrock-guardrailed
  deployment:
    labels:
      app.kubernetes.io/instance: agent

agents:
  elasticsearch:
    enabled: true
    description: "Elasticsearch / Kubernetes logs assistant for analyzing info, debug, and error logs and troubleshooting crashes (via MCP)"
    toolNames:
      - list-indices
      - search
      - count
      - get-document
      - index-mappings
      - index-stats
      - cluster-health
      - cluster-stats
      - switch-connection

  kafka:
    enabled: true
    description: "Kafka assistant agent (via MCP)"
    toolNames:
      - list-topics
      - describe-topic
      - create-topic
      - delete-topic
      - produce-message
      - consume-messages
      - list-broker
      - list-consumer
      - describe-consumer-group

  mongodb:
    enabled: true
    description: "MongoDB assistant agent (via MCP)"
    toolNames:
      - list-databases
      - list-collections
      - db-stats
      - collection-schema
      - find
      - aggregate
      - count
      - collection-indexes
      - mongodb-logs
      - switch-connection
      - drop-collection
      - create-collection

  gitlab:
    enabled: true
    description: "GitLab assistant agent (via MCP)"
    # Every tool here is read-only, matching mcps.gitlab-mcp.env.GITLAB_READ_ONLY.
    # Setting that to "false" exposes write tools, but they still have to be
    # listed here before the agent can call them.
    toolNames:
      - compare-refs
      - get-branch
      - get-commit
      - get-commit-diff
      - get-current-user
      - get-file-contents
      - get-group
      - get-issue
      - get-job
      - get-job-log
      - get-merge-request
      - get-merge-request-diffs
      - get-pipeline
      - get-project
      - get-repository-tree
      - list-branches
      - list-commits
      - list-group-projects
      - list-groups
      - list-issue-notes
      - list-issues
      - list-labels
      - list-merge-request-notes
      - list-merge-requests
      - list-milestones
      - list-pipeline-jobs
      - list-pipelines
      - list-project-members
      - list-projects
      - list-tags
      - list-users
      - search

  # Orchestrator: its tools are other agents, so it has no backing MCP. Each
  # delegate must already exist in the release namespace -- gitlab-agent comes
  # from this chart, k8s-agent ships with kagent. agents-rules/main.md names the
  # same agents in prose; keep the two in sync.
  main:
    enabled: true
    description: "Main orchestration agent that delegates tasks to specialized agents."
    # A delegate is a bare name, or a map that may also set namespace and
    # isolateSessions (a fresh sub-agent session per call, for safe parallel
    # fan-out). isolateSessions is NOT in the kagent 0.9.12 CRD installed here:
    # the API rejects the whole Agent with a strict decoding error, so it stays
    # off until kagent is upgraded.
    delegates:
      - gitlab-agent
      - k8s-agent
      # - name: gitlab-agent
      #   isolateSessions: true
      # - name: k8s-agent
      #   isolateSessions: true
    memory:
      enabled: false

  # Standalone assistant: no MCP and no delegates, so it renders with no tools.
  # Named "test" rather than "test-agent" to match the resource already in the
  # cluster.
  test:
    enabled: true
    name: test
    description: "ema shelha begeces"
    runtime: python
    memory:
      enabled: false
    compaction:
      enabled: false
