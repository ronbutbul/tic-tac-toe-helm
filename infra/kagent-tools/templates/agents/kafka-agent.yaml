{{- $agentKey := "kafka" }}
{{- $mcpKey := "kafka-mcp" }}
{{- $agent := dig $agentKey dict (default dict .Values.agents) }}
{{- $mcp := dig $mcpKey dict (default dict .Values.mcps) }}
{{- if and (dig "enabled" false $mcp) (dig "enabled" false $agent) }}
{{- $agentName := dig "name" (printf "%s-agent" $agentKey) $agent }}
{{- $mcpName := include "mcp-tools.resourceName" (dict "releaseName" .Release.Name "mcpKey" $mcpKey) }}
{{- $toolNames := dig "toolNames" (list
      "list-topics"
      "describe-topic"
      "create-topic"
      "delete-topic"
      "produce-message"
      "consume-messages"
      "list-broker"
      "list-consumer"
      "describe-consumer-group") $agent }}
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $agentName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-tools.mcpLabels" (dict "chartName" .Chart.Name "chartVersion" .Chart.Version "mcpKey" $agentName "releaseName" .Release.Name "releaseService" .Release.Service) | nindent 4 }}
  {{- with dig "annotations" dict $agent }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  description: {{ dig "description" "Kafka assistant agent (via MCP)" $agent | quote }}
  type: Declarative
  declarative:
    modelConfig: {{ $agent.modelConfigRef | default $agent.modelConfig | default "vllm-gpt" }}
    stream: {{ dig "stream" true $agent }}
    systemMessage: |
      {{- include "mcp-tools.agentSystemMessage" (dict "root" $ "agentKey" $agentKey "indent" 6) }}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ $mcpName }}
          toolNames:
            {{- toYaml $toolNames | nindent 12 }}
    {{- with (include "mcp-tools.agentMemory" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with (include "mcp-tools.agentContext" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with dig "deployment" dict $agent }}
    deployment:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
