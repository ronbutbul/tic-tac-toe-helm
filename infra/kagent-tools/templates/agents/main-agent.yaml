{{/*
Orchestration agent: its tools are other Agents rather than an MCP server, so
like test-agent it is gated on the agent flag alone.

The delegate list is data (agents.main.delegates) rather than literals here, but
agents-rules/main.md names the same agents in prose -- the model needs to know
what each one is for. Change one and change the other, or the prompt will
advertise an agent that is not wired up (or hide one that is).
*/}}
{{- $agentKey := "main" }}
{{- $agent := dig $agentKey dict (default dict .Values.agents) }}
{{- if dig "enabled" false $agent }}
{{- $agentName := dig "name" (printf "%s-agent" $agentKey) $agent }}
{{- $delegates := dig "delegates" (list "gitlab-agent" "k8s-agent") $agent }}
{{- if not $delegates }}
{{- fail (printf "agents.%s.delegates is empty: an orchestration agent with no agents to delegate to has no tools at all" $agentKey) }}
{{- end }}
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $agentName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-tools.mcpLabels" (dict "chartName" .Chart.Name "chartVersion" .Chart.Version "mcpKey" $agentName "releaseName" .Release.Name "releaseService" .Release.Service) | nindent 4 }}
  {{- with dig "annotations" dict $agent }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  description: {{ dig "description" "Main orchestration agent that delegates tasks to specialized agents." $agent | quote }}
  type: Declarative
  declarative:
    modelConfig: {{ $agent.modelConfigRef | default $agent.modelConfig | default "vllm-gpt" }}
    {{- with $agent.runtime }}
    runtime: {{ . }}
    {{- end }}
    stream: {{ dig "stream" true $agent }}
    systemMessage: |-
      {{- include "mcp-tools.agentSystemMessage" (dict "root" $ "agentKey" $agentKey "indent" 6) }}
    {{- /*
    A delegate is referenced by bare name, so it must live in this same
    namespace. kagent's own agents (k8s-agent and friends) are installed
    alongside this release, so that holds by default.
    */}}
    tools:
      {{- range $delegate := $delegates }}
      - type: Agent
        agent:
          name: {{ $delegate }}
      {{- end }}
    {{- with (include "mcp-tools.agentMemory" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with (include "mcp-tools.agentContext" (dict "agent" $agent "agentKey" $agentKey)) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with dig "deployment" dict $agent }}
    deployment:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
