
workflow:
  serviceAccount:
    create: true
    name: argo-workflow

  rbac:
    create: true
    serviceAccounts:
      - name: argo-workflow
        namespace: argo-workflow

controller:
  workflowDefaults:
    spec:
      serviceAccountName: argo-workflow


server:
  authModes:
    - server
  serviceType: ClusterIP

  secure: false

  ingress:
    enabled: true

    ingressClassName: nginx

    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    hosts:
      - argoworkflows.testmpr.aws2.rafael.co.il

    paths:
      - /

    pathType: Prefix

    tls:
      - secretName: testmpr-aws-wildcard-cert
        hosts:
          - argoworkflows.testmpr.aws2.rafael.co.il

images:
  pullPolicy: IfNotPresent