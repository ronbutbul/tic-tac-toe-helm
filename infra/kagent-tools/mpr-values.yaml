# ==============================================================================
# MPR ENVIRONMENT
# ==============================================================================
# Everything specific to this cluster and account: endpoints, credentials and
# the guardrail. Structure, resources, probes, tool lists and agent wiring live
# in values.yaml -- this file only states what differs here.

# ==============================================================================
# MODEL CONFIGS
# ==============================================================================
modelConfigs:
  bedrock-guardrailed:
    # This account's guardrail. Provider, model and the proxy baseUrl come from
    # values.yaml.
    defaultHeaders:
      X-Amzn-Bedrock-GuardrailIdentifier: "arn:aws:bedrock:eu-central-1:941284018955:guardrail/wrfcu805qvyf"
      X-Amzn-Bedrock-GuardrailVersion: "DRAFT"


# ==============================================================================
# PROXIES
# ==============================================================================
# Signs Bedrock requests with the IAM role on the kagent-bedrock ServiceAccount
# (IRSA). Image, region, upstream host and stripped headers come from values.yaml.
proxies:
  bedrock-sigv4-proxy:
    enabled: true


# ==============================================================================
# MCP SERVERS
# ==============================================================================
mcps:
  gitlab-mcp:
    env:
      GITLAB_URL: "https://gitlab.rafael.co.il"
    # Live credential committed to this repo: scope it to read_api on a single
    # project or group rather than a personal token, and rotate it in GitLab if
    # this repo is shared more widely.
    secretData:
      GITLAB_TOKEN: "NHoVKT7qjdOF6Gwa2k8EhW86MQp1OmV2cgk.01.0z1t1xsfm"

  elasticsearch-mcp:
    env:
      ES_MCP_CONNECTION_STRING: "http://elastic-kibana-elasticsearch:9200"

  mongodb-mcp:
    env:
      MDB_MCP_CONNECTION_STRING: "mongodb://mongo8-primary:27017"

  kafka-mcp:
    env:
      KAFKA_BOOTSTRAP_SERVERS: "bitnami-kafka:9092"
      KAFKA_ADMIN_SERVERS: "bitnami-kafka-controller-headless:9093"
